# =================== Logstash Pipeline: Apollo Server Logs ===================
#  CONFIGURACIÓN COMPLETA PARA PROCESAMIENTO DE LOGS

input {
  # 📨 Recibir logs de Filebeat
  beats {
    port => 5044
    type => "apollo-logs"
  }
  
  #  Opcional: Input directo desde archivos (backup)
  file {
    path => ["/var/log/apollo/*.log"]
    type => "apollo-file-logs"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  # 🏷 Procesar logs de Apollo Server
  if [service] == "apollo-fintech-server" {
    
    #  Parsear JSON logs de Winston
    if [component] == "application" {
      json {
        source => "message"
        target => "apollo"
      }
      
      # 📅 Parsear timestamp
      date {
        match => [ "[apollo][timestamp]", "ISO8601" ]
        target => "@timestamp"
      }
      
      # 🏷 Extraer nivel de log
      mutate {
        add_field => { "log_level" => "%{[apollo][level]}" }
        add_field => { "service_version" => "1.0.0" }
        add_field => { "environment" => "production" }
      }
      
      #  Procesar logs de GraphQL
      if [apollo][message] {
        grok {
          match => { 
            "[apollo][message]" => [
              "GraphQL operation started.*operationName.*%{WORD:graphql_operation}",
              "Fetching.*%{WORD:data_operation}.*%{DATA:operation_details}",
              "Error.*%{GREEDYDATA:error_details}"
            ]
          }
          tag_on_failure => ["_grokparsefailure_apollo"]
        }
      }
      
      #  Extraer métricas de performance
      if [apollo][meta] {
        ruby {
          code => "
            meta = event.get('[apollo][meta]')
            if meta.is_a?(Hash)
              if meta['duration']
                event.set('response_time_ms', meta['duration'])
              end
              if meta['userId']
                event.set('user_id', meta['userId'])
              end
            end
          "
        }
      }
    }
    
    #  Procesar logs de Nginx
    if [component] == "nginx-access" {
      grok {
        match => { 
          "message" => "%{NGINXACCESS}"
        }
      }
      
      #  Convertir códigos de respuesta a categorías
      if [response] {
        if [response] >= 200 and [response] < 300 {
          mutate { add_tag => [ "success" ] }
        } else if [response] >= 300 and [response] < 400 {
          mutate { add_tag => [ "redirect" ] }
        } else if [response] >= 400 and [response] < 500 {
          mutate { add_tag => [ "client_error" ] }
        } else if [response] >= 500 {
          mutate { add_tag => [ "server_error" ] }
        }
      }
      
      #  GeoIP lookup para análisis geográfico
      geoip {
        source => "clientip"
        target => "geoip"
      }
      
      # 🤖 Detectar user agents
      useragent {
        source => "agent"
        target => "user_agent"
      }
    }
    
    #  Procesar logs de error de Nginx
    if [component] == "nginx-error" {
      grok {
        match => { 
          "message" => "(?<timestamp>%{YEAR}[./]%{MONTHNUM}[./]%{MONTHDAY} %{TIME}) \[%{LOGLEVEL:severity}\] %{POSINT:pid}#%{NUMBER}: %{GREEDYDATA:errormessage}"
        }
      }
      
      date {
        match => [ "timestamp", "yyyy/MM/dd HH:mm:ss" ]
      }
      
      mutate { add_tag => [ "nginx_error" ] }
    }
  }
  
  # 🖥 Procesar logs de sistema
  if [component] == "system" {
    grok {
      match => { 
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{IPORHOST:logsource} %{PROG:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:logmessage}"
      }
    }
    
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }
  }
  
  #  Procesar logs de PM2
  if [component] == "pm2" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:pm2_timestamp}.*%{LOGLEVEL:pm2_level}.*%{GREEDYDATA:pm2_message}"
      }
    }
    
    date {
      match => [ "pm2_timestamp", "ISO8601" ]
    }
  }
  
  # 🧹 Limpiar campos innecesarios
  mutate {
    remove_field => [ "beat", "input", "ecs", "agent" ]
  }
  
  # 🏷 Agregar etiquetas finales
  mutate {
    add_tag => [ "processed_by_logstash" ]
    add_field => { 
      "[@metadata][index_prefix]" => "apollo-logs"
      "processing_timestamp" => "%{@timestamp}"
    }
  }
}

output {
  #  Enviar a Elasticsearch con índices dinámicos
  elasticsearch {
    hosts => ["localhost:9200"]
    
    #  Índices por tipo de log y fecha
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    
    #  Template para optimizar el mapeo
    template_name => "apollo-logs"
    template => "apollo-logs-template.json"
    template_overwrite => true
    
    #  Configuración de performance
    workers => 2
    flush_size => 500
    idle_flush_time => 1
  }
  
  # 🖥 Output a consola para debugging (comentar en producción)
  stdout { 
    codec => rubydebug 
  }
  
  #  Output a archivo para backup
  file {
    path => "/var/log/logstash/processed-apollo-%{+YYYY-MM-dd}.log"
    codec => json_lines
  }
  
  #  Enviar errores críticos a sistema de alertas
  if "server_error" in [tags] or "error" in [log_level] {
    # Configurar aquí integración con Slack, PagerDuty, etc.
    file {
      path => "/var/log/logstash/critical-errors-%{+YYYY-MM-dd}.log"
      codec => json_lines
    }
  }
}
