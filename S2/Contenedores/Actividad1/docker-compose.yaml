name: "wordpress"
services:
    wp-db:
      image: mysql:8.1
      container_name: wp-db
      volumes:
        - wp-db-data:/var/lib/mysql
      environment:
        MYSQL_ROOT_PASSWORD: "rootpassword"
        MYSQL_DATABASE: "wordpress"
        MYSQL_USER: "wpuser"
        MYSQL_PASSWORD: "wppassword"
      networks:
        - wp-network
      healthcheck:
        test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword | grep 'mysqld is alive'"]
        interval: 10s
        timeout: 10s
        retries: 5
        start_period: 20s

    wp-php:
      build: 
        context: ./WordPress
        dockerfile: Dockerfile
      image: fadedguy/my-wordpress:latest
      container_name: wp-php
      environment:
        DB_NAME: "wordpress"
        DB_USER: "wpuser"
        DB_PASSWORD: "wppassword"
        DB_HOST: "wp-db"
        WP_URL: "http://localhost:8080"
        WP_TITLE: "WordPressDockerCompose"
        WP_ADMIN_USER: "admin"
        WP_ADMIN_PASSWORD: "adminpassword"
        WP_ADMIN_EMAIL: "kevin.aceves@hotmail.com"
      depends_on: 
        wp-db:
          condition: service_healthy
      networks:
        - wp-network

    wp-nginx:
      build: 
        context: ./Nginx
        dockerfile: Dockerfile
      image: fadedguy/my-nginx:latest
      container_name: wp-nginx
      ports:
        - "8080:80"
      depends_on:
        - wp-php
      networks:
        - wp-network
    
volumes:
  wp-db-data:
    driver: local

networks:
  wp-network:
    driver: bridge